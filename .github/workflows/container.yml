name: Publish external container

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published CLI version with public musl assets and canonical checksums
        required: true
        default: '0.21.0'
        type: string

permissions:
  contents: read

concurrency:
  group: container-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate release version
        id: release
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION-external" >> "$GITHUB_OUTPUT"
          skill_dir=skills/reolink-cli
          if [ -d plugins/reolink-cli/skills/reolink-cli ]; then
            skill_dir=plugins/reolink-cli/skills/reolink-cli
          fi
          echo "skill_dir=$skill_dir" >> "$GITHUB_OUTPUT"
      - name: Test host entry points
        run: python3 scripts/test-container-cli.py
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build amd64 for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            REOLINK_VERSION=${{ inputs.version }}
            REOLINK_SKILL_DIR=${{ steps.release.outputs.skill_dir }}
          load: true
          tags: reolink-cli:ci-amd64
      - name: Test amd64 deployment
        run: |
          docker buildx build --builder default --platform linux/amd64 --load \
            -f container/agent.Dockerfile \
            --build-arg REOLINK_IMAGE=reolink-cli:ci-amd64 \
            --build-arg AGENT_IMAGE=reolink-cli:ci-amd64 \
            -t reolink-agent:ci-amd64 .
          python3 scripts/check-container.py --image reolink-cli:ci-amd64 --agent-image reolink-agent:ci-amd64
      - name: Build arm64 for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            REOLINK_VERSION=${{ inputs.version }}
            REOLINK_SKILL_DIR=${{ steps.release.outputs.skill_dir }}
          load: true
          tags: reolink-cli:ci-arm64
      - name: Test arm64 deployment
        run: |
          docker buildx build --builder default --platform linux/arm64 --load \
            -f container/agent.Dockerfile \
            --build-arg REOLINK_IMAGE=reolink-cli:ci-arm64 \
            --build-arg AGENT_IMAGE=reolink-cli:ci-arm64 \
            -t reolink-agent:ci-arm64 .
          python3 scripts/check-container.py --image reolink-cli:ci-arm64 --agent-image reolink-agent:ci-arm64
      - name: Log in to GHCR after tests pass
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            REOLINK_VERSION=${{ inputs.version }}
            REOLINK_SKILL_DIR=${{ steps.release.outputs.skill_dir }}
          push: true
          tags: ${{ steps.release.outputs.image }}
